[tool.poetry]
name = "ged-approximation"
version = "0.1.0"
description = "Approximation Algorithms for Graph Edit Distance experiments"
authors = ["michaelflppv <mikhail.filippov@students.uni-mannheim.de>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
pandas = "2.0.3"
numpy = "1.24.3"
matplotlib = "3.7.5"
scipy = "1.10.1"
statsmodels = "0.14.1"
torch = "2.4.1"
torch-geometric = "2.6.1"
psutil = "6.1.1"
networkx = "1.10"
texttable = "1.7.0"
tqdm = "4.67.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
